## define the cuda 
cuda: 3

######################### data 
# dataset: brca
h5_dir: ".../brca/encoded_uni/h5_files"
morph_dir: ".../brca/data/morphs_csv"
labels_csv: ".../brca/data/brca/evaluation/reference.csv"

# dataset: camelyon
# h5_dir: ".../camelyon/encoded_uni/h5_files"
