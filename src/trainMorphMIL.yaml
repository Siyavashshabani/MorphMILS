## training 
mode: train #train #train #test
epochs: 100 #30 #16 #3 #200
n_classes: 2

##optimizer 
lr: 5e-5 #5e-6 #4e-5
wd: 5e-3
scheduler: plateau

## model
backbone: MorphMIL #TransMIL
adaptor: vit #fno
pool: mean_median #max #max   attn
emd_dim: 512 #512 #512 #1024 #1024
emd_morph_dim: 246 #246 #1024
input_dim: 1024 #1270  #1270 #1270 #1270 #1024 #1536 #2048
input_morph_dim: 246 #246
trans: nystrom #mamba #att #nystrom att
ppeg: norm #addaptive #norm
game_theory: False #False #borrowing the idea of game theory

## ways of fusion 
simple_concat: True #False
base_input_dim: 1024
morph_dim: 246 #246

model_branch: image #both #both #image
cancat_type: simple #one_to_all #simple #one_to_all

## loss 
loss_type: ce_jsd #ce_jsd #ce #ce_jsd #ce_con #ce #jsd #jsd #ce_jsd  #ce_con
alpha_jsd: 40 #
alpha_con: 0.1

## augmetation for Jsd
aug_flag: True #True #True #False
aug_morph: False #True #True #False